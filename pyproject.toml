[project]
name = "longecho"
version = "0.1.0"
description = "Long-form audio generation with Echo-TTS using text chunking and streaming"
authors = [
    {name = "LongEcho Contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "watchdog>=4.0.0",
    # Echo-TTS vendored dependencies
    "torch>=2.11.0,<2.12",
    "torchaudio>=2.11.0,<2.12",
    "numpy",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "torchcodec>=0.11.0,<0.12",
]

# Note: On Windows, torchcodec requires FFmpeg shared DLLs in PATH
# See README for installation instructions
#
# PyTorch 2.11 ships CUDA 13.0 as the default build on PyPI, so torch/torchaudio
# install straight from PyPI with no custom index. torchaudio's final release is
# 2.11.0, which pins the whole torch stack to the 2.11 line (torchcodec tracks it
# at 0.11).

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
