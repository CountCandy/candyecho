[project]
name = "longecho"
version = "0.1.0"
description = "Long-form audio generation with Echo-TTS using text chunking and streaming"
authors = [
    {name = "LongEcho Contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "watchdog>=4.0.0",
    # Echo-TTS vendored dependencies
    "torch>=2.11.0,<2.12",
    "torchaudio>=2.11.0,<2.12",
    "numpy",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "torchcodec>=0.11.0,<0.12",
]

# Note: On Windows, torchcodec requires FFmpeg shared DLLs in PATH
# See README for installation instructions

[tool.uv]
# PyTorch CUDA 13.0 index. CUDA wheels for Windows (and Linux) are published
# here, not on PyPI - PyPI's Windows torch is CPU-only - so torch/torchaudio must
# come from this index to get a CUDA build on every platform. torchaudio's final
# release is 2.11.0, which pins the whole torch stack to the 2.11 line (torchcodec
# tracks it at 0.11 and stays on PyPI).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Best-of-N take verification: transcribes each generated take and keeps the one
# closest to the text. Optional because it pulls several GB of ASR weights.
verify = [
    "transformers>=4.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
