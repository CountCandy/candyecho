# TEMPORARY: regenerates uv.lock on a runner that can reach the PyTorch index.
# Removed again once the refreshed lockfile is committed.
name: Relock (temporary)

on:
  pull_request:

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
      - run: uv lock --python 3.12
      - run: |
          echo "LOCKDIFF-BEGIN"
          git diff -- uv.lock | gzip -9 | base64 -w 4000
          echo "LOCKDIFF-END"
