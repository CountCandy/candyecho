name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # torchcodec loads FFmpeg shared libraries at import time, so the test
      # suite (which imports the vendored inference code) needs FFmpeg present.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      # Installs the exact CUDA-13 stack from the committed lockfile.
      # --locked fails the build if uv.lock is out of sync with pyproject.toml.
      - name: Install dependencies
        run: uv sync --extra dev --locked --python 3.12

      - name: Run tests
        run: uv run pytest
